name: Build and push hearts-server

# Publishes the API image to GHCR — deploy/deploy.sh pulls whatever this
# pushes to `:latest`. Triggered by changes to the server or the engine it
# depends on, plus manual runs (e.g. to re-push without a code change).
on:
  push:
    branches: [main]
    paths:
      - "crates/hearts-server/**"
      - "crates/hearts-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hearts-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/hearts-server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
