name: Build and push hearts-server

# Publishes the API image to GHCR — deploy/deploy.sh pulls whatever this
# pushes to `:latest`. Triggered by changes to the server or the engine it
# depends on, plus manual runs (e.g. to re-push without a code change).
on:
  push:
    branches: [main]
    paths:
      - "crates/hearts-server/**"
      - "crates/hearts-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hearts-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The default `docker` buildx driver can't export cache (`cache-to:
      # type=gha` below) — needs the `docker-container` driver this sets up.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: crates/hearts-server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
