[package]
name = "hearts-cli"
version.workspace = true
edition.workspace = true
description = "Terminal client for playing the game locally."

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6.0.0"
futures-util = "0.3.32"
hearts-core = { workspace = true, features = ["serde"] }
ratatui = "0.30.2"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
rpassword = "7.5.4"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time"] }
