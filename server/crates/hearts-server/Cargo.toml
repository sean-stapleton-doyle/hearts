[package]
name = "hearts-server"
version.workspace = true
edition.workspace = true
description = "Game server (Axum) exposing hearts-core over the network."

[dependencies]
anyhow = "1.0.103"
argon2 = "0.5.3"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
hearts-core = { workspace = true, features = ["serde"] }
rand = "0.10.2"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "chrono", "uuid"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.4", features = ["serde"] }
