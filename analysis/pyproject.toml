[project]
name = "hearts-analysis"
version = "0.1.0"
description = "Statistical, probabilistic, and game-theoretic analysis of the hearts (Oh Hell-family) card game."
requires-python = ">=3.12"
dependencies = [
    "pyhearts",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "matplotlib>=3.9",
    "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8", "jupyterlab>=4"]

[tool.uv.sources]
pyhearts = { path = "../crates/hearts-py" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearts_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["smoke: end-to-end experiment smoke tests"]
